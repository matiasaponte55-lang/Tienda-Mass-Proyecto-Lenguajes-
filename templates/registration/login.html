{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Tiendas Mass{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-header bg-primary text-white text-center py-3" style="background-color: #0d47a1 !important;">
                <h4 class="mb-0 fw-bold"><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</h4>
                <small class="text-warning">Tiendas Mass Online</small>
            </div>
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger py-2" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i> Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuario:</label>
                        <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Contraseña:</label>
                        <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 fw-bold py-2 mt-2">
                        <i class="bi bi-check-circle"></i> Ingresar
                    </button>
                </form>
            </div>
            <div class="card-footer text-center bg-light py-3">
                <small>¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}" class="fw-bold text-primary">Regístrate aquí</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
